<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bishora — Helping Local Businesses Get Found, Get Leads and Grow Online">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1523" />
      <stop offset="100%" stop-color="#182437" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6691ff" />
      <stop offset="100%" stop-color="#1c3073" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.65">
      <stop offset="0%" stop-color="#3e6cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3e6cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Logo mark -->
  <g transform="translate(80 74)">
    <rect width="76" height="76" rx="22" fill="url(#mark)" />
    <path d="M20 52 L32 37 L41 46 L56 24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="56" cy="24" r="5.5" fill="#eeb95f" />
  </g>

  <!-- Wordmark -->
  <text x="178" y="128" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Bishora</text>
  <text x="180" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4.5" fill="#96b7ff">DIGITAL MARKETING</text>

  <!-- Headline -->
  <text x="80" y="290" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#ffffff">
    <tspan x="80" dy="0">Helping Local Businesses</tspan>
    <tspan x="80" dy="76">Get Found, Get Leads</tspan>
    <tspan x="80" dy="76">&amp; Grow Online.</tspan>
  </text>

  <!-- Supporting copy -->
  <text x="80" y="540" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#a3b7d1">
    <tspan x="80" dy="0">SEO · Google Business Profile · Google Ads · Facebook &amp; Instagram Ads</tspan>
    <tspan x="80" dy="36">Website Development · Social Media Marketing</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="80" y="592" width="120" height="6" rx="3" fill="#eeb95f" />
</svg>

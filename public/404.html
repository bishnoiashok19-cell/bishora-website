<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Bishora</title>
    <meta
      name="description"
      content="The page you are looking for could not be found. Head back to the Bishora homepage."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://bishora.com/" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #0d1523;
        color: #e8eef6;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 34rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.25rem;
        padding: 3rem 2rem;
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
        margin: 0;
        color: #3e6cf6;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p {
        margin: 1rem 0 0;
        color: #a3b7d1;
        line-height: 1.65;
      }
      .actions {
        margin-top: 2rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.4rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .primary {
        background: #244bdc;
        color: #fff;
      }
      .primary:hover {
        background: #1c3bb4;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #e8eef6;
      }
      .secondary:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      footer {
        margin-top: 2rem;
        color: #6f8bad;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>We could not find that page.</h1>
      <p>
        The link may be out of date, or the page may have moved. Head back to the
        Bishora homepage to keep exploring.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="secondary" href="/contact">Get in touch</a>
      </div>
      <footer>Bishora — Helping local businesses get found, get leads and grow online.</footer>
    </main>
  </body>
</html>

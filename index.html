<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme colours for mobile browser chrome -->
    <meta name="theme-color" content="#0d1523" />

    <!-- ===== Primary SEO (defaults; each route overrides these at runtime) ===== -->
    <title>Bishora — Helping Local Businesses Get Found, Get Leads &amp; Grow Online</title>
    <meta
      name="description"
      content="Bishora helps local businesses get found online with SEO, AEO, GEO, Google Business Profile optimisation, paid advertising, websites, social media and email marketing."
    />
    <meta
      name="keywords"
      content="digital marketing agency, SEO, AEO, GEO, local SEO, Google Business Profile, paid advertising, Google Ads, landing page design, WhatsApp marketing, email marketing, content creation, graphic design"
    />
    <meta name="author" content="Bishora" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bishora.com/" />

    <!-- ===== Open Graph ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bishora" />
    <meta property="og:locale" content="en" />
    <meta
      property="og:title"
      content="Bishora — Helping Local Businesses Get Found, Get Leads &amp; Grow Online"
    />
    <meta
      property="og:description"
      content="Bishora helps local businesses get found online with SEO, AEO, GEO, Google Business Profile optimisation, paid advertising, websites, social media and email marketing."
    />
    <meta property="og:url" content="https://bishora.com/" />
    <meta property="og:image" content="https://bishora.com/og-image.svg" />
    <meta property="og:image:alt" content="Bishora — digital marketing for local businesses" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ===== Twitter / X card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bishora — Helping Local Businesses Get Found, Get Leads &amp; Grow Online"
    />
    <meta
      name="twitter:description"
      content="Bishora helps local businesses get found online with SEO, AEO, GEO, Google Business Profile optimisation, paid advertising, websites, social media and email marketing."
    />
    <meta name="twitter:image" content="https://bishora.com/og-image.svg" />
    <meta name="twitter:image:alt" content="Bishora — digital marketing for local businesses" />

    <!-- ===== Typography ===== -->
    <!-- Self-hosted woff2 (latin subset). Preloaded so headings paint in the
         brand typeface without a visible flash. -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ===== Structured data ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://bishora.com/#organization",
        "name": "Bishora",
        "alternateName": "Bishora Digital Marketing Agency",
        "url": "https://bishora.com/",
        "logo": "https://bishora.com/favicon.svg",
        "image": "https://bishora.com/og-image.svg",
        "description": "Bishora is a digital marketing agency helping small and local businesses get found, get leads and grow online through SEO, AEO, GEO, Google Business Profile optimisation, paid advertising, website development, landing pages, social media, WhatsApp and email marketing.",
        "areaServed": "Local businesses",
        "knowsAbout": [
          "Search Engine Optimization",
          "Answer Engine Optimization",
          "Generative Engine Optimization",
          "Local SEO",
          "Google Business Profile",
          "Paid Advertising",
          "Google Ads",
          "Facebook and Instagram Ads",
          "Website Development",
          "Landing Page Design",
          "Social Media Marketing",
          "WhatsApp Marketing",
          "Email Marketing",
          "Content Creation",
          "Graphic Design"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Digital marketing services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AEO" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "GEO" } },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Google Business Profile Optimization"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Paid Advertising" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Website Development" }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Landing Page Design & Development"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Social Media Marketing" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "WhatsApp Marketing" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Email Marketing" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Content Creation" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Graphic Design" }
            }
          ]
        }
      }
    </script>

    <!--
      Scroll-reveal is a progressive enhancement. If JavaScript is unavailable the
      fallback below keeps all content fully visible.
    -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif">
        <h1>Bishora</h1>
        <p>
          Helping local businesses get found, get leads and grow online. This site needs JavaScript
          enabled to browse. You can also reach us at
          <a href="https://bishora.com/contact">bishora.com/contact</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
